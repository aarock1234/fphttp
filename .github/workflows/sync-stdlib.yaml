name: Sync net/http from Go main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Go branch, tag, or commit
        required: true
        default: master
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-stdlib
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Merge production sources
        id: sync
        env:
          UPSTREAM_REF: ${{ inputs.ref }}
        run: go run ./internal/cmd/syncstdlib -ref "$UPSTREAM_REF" -github-output "$GITHUB_OUTPUT"

      - name: Build
        if: steps.sync.outputs.changed == 'true'
        run: go build ./...

      - name: Check production source
        if: steps.sync.outputs.changed == 'true'
        run: go run ./internal/cmd/checksource

      - name: Check patch
        if: steps.sync.outputs.changed == 'true'
        run: git diff --check

      - name: Create PR
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "sync: update net/http from Go ${{ steps.sync.outputs.revision }}"
          branch: sync/stdlib-${{ steps.sync.outputs.revision }}
          title: "sync: update net/http from Go ${{ steps.sync.outputs.revision }}"
          body: |
            Updated production sources from [Go main](https://github.com/golang/go/tree/${{ steps.sync.outputs.revision }}/src/net/http).

            Three-way merges preserve local fingerprint changes and stop on conflicts. New and removed upstream files are included. Production builds, formatting checks, static analysis, and patch checks must pass before this PR is created.

            The source adaptations and manually maintained exceptions are described in the README.
          delete-branch: true
