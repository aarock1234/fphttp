name: Sync browser profiles

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-profiles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate browser builds
        run: go generate ./internal/catalog

      - name: Detect changes
        id: sync
        run: |
          if git diff --quiet -- internal/catalog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Verification reads browser source at release tags, which never
      # change, so the files carry over between runs. The build list decides
      # which files are read; a new list restores the newest earlier cache
      # and saves it with the files it adds.
      - name: Cache browser source
        if: steps.sync.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/fphttp/verifyprofiles
          key: verifyprofiles-${{ hashFiles('internal/catalog/builds_gen.go') }}
          restore-keys: verifyprofiles-

      # Findings, such as a new browser major with no span yet, do not stop
      # the sync: they go into the pull request body, which opens as a draft.
      - name: Verify profiles
        id: verify
        if: steps.sync.outputs.changed == 'true'
        run: |
          findings="$RUNNER_TEMP/findings.txt"
          if go run ./internal/cmd/verifyprofiles > "$findings"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$findings"

      - name: Build
        if: steps.sync.outputs.changed == 'true'
        run: go build ./...

      - name: Check production source
        if: steps.sync.outputs.changed == 'true'
        run: go run ./internal/cmd/checksource

      - name: Check patch
        if: steps.sync.outputs.changed == 'true'
        run: git diff --check

      - name: Write PR body
        if: steps.sync.outputs.changed == 'true'
        run: |
          {
            echo "Regenerated \`internal/catalog/builds_gen.go\` from official browser release feeds through ${{ steps.sync.outputs.date }}."
            echo
            echo "Each row is the newest published build of a browser major version on one platform. Production builds, formatting checks, static analysis, and patch checks passed."
            echo
            if [ "${{ steps.verify.outputs.clean }}" = "true" ]; then
              echo "Profile verification passed."
            else
              echo "Profile verification failed, so this PR is a draft. Update the catalog on this branch before merging."
              echo
              echo '```text'
              cat "$RUNNER_TEMP/findings.txt"
              echo '```'
              echo
              echo "Full output: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          } > "$RUNNER_TEMP/body.md"

      - name: Create PR
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "sync: update browser profiles ${{ steps.sync.outputs.date }}"
          branch: sync/profiles
          title: "sync: update browser profiles ${{ steps.sync.outputs.date }}"
          body-path: ${{ runner.temp }}/body.md
          draft: ${{ steps.verify.outputs.clean == 'true' && 'false' || 'always-true' }}
          delete-branch: true
