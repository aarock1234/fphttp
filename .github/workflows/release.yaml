name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (use 'none' to release the current latest tag without bumping)"
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF#refs/tags/}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              latest="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          if [ "$BUMP" = "none" ]; then
            if [ -z "$latest" ]; then
              echo "no existing tag to release; choose patch/minor/major" >&2
              exit 1
            fi
            echo "version=$latest" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac

          echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "needs_tag=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build source checker
        run: go build -o "$RUNNER_TEMP/fphttp-checksource" ./internal/cmd/checksource

      - name: Select tagged source
        if: steps.tag.outputs.needs_tag == 'false'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.version }}
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Build
        run: go build ./...

      - name: Check production source
        run: '"$RUNNER_TEMP/fphttp-checksource"'

      - name: Tag and push
        if: steps.tag.outputs.needs_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.version }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
